<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        header, footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }

        main {
            max-width: 600px;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid gray;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #eeeeff;
        }

        fieldset {
            margin-top: 15px;
        }

        input, select, textarea {
            margin-top: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <section>
            <h2>Courses and Fees</h2>
            <table>
                <caption>Available Courses</caption>
                <tr>
                    <th scope="col">Course</th>
                    <th scope="col">Seats</th>
                    <th scope="col">Fees</th>
                </tr>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>₹90,000</td>
                </tr>
                <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>₹45,000</td>
                </tr>
            </table>
        </section>

        <section>
            <form action="#" method="get">
                <fieldset>
                    <legend>Application Form</legend>

                    <label for="student-name">Name:</label><br>
                    <input type="text" id="student-name" name="name" required>
                    <br>

                    <label for="student-email">Email:</label><br>
                    <input type="email" id="student-email" name="email" required>
                    <br>

                    <label for="student-course">Course:</label><br>
                    <select id="student-course" name="course">
                        <option value="B.Tech CSE">B.Tech CSE</option>
                        <option value="BCA">BCA</option>
                    </select>
                    <br>

                    <label for="statement">Statement:</label><br>
                    <textarea id="statement" name="statement" rows="4" cols="35"></textarea>
                    <br>

                    <button type="submit">Apply</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        &copy; 2026 ABC College
    </footer>
</body>
</html>
