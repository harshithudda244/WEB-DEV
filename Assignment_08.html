<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links and Images</title>
</head>
<body>
    <h3 id="top">Links demo</h3>

    <p>
        <a href="https://www.example.com" target="_blank" rel="noopener">External link</a><br>
        <a href="#bottom">Jump to bottom</a><br>
        <a href="mailto:college@example.com">Email us</a>
    </p>

    <p>Logo</p>
    <a href="https://www.example.com" target="_blank" rel="noopener">
        <img src="assets/logo.svg" alt="College logo" width="100" height="70" title="College logo">
    </a>

    <div style="height: 250px;"></div>

    <p id="bottom">Bottom. <a href="#top">Back to top</a></p>
</body>
</html>
