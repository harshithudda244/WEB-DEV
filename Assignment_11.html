<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Page</title>
</head>
<body>
    <a href="#main-content">Skip to main content</a><br>
    <a href="#help">Home Help</a>

        <img src="assets/logo.svg" alt="College logo" width="150" height="50">

    <footer id="help">
        <p>For help, contact the college office.</p>
    </footer>
</body>
</html>
