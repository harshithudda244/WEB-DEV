<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Portal</title>
</head>
<body>
    <!-- Semantic layout -->
    <header>
        <h1>College Portal</h1>
        <nav>
            <a href="#home">Home</a> |
            <a href="#courses">Courses</a>
        </nav>
    </header>

    <main id="home">
        <section>
            <h2>Admission Open</h2>
            <p>Apply before 30 June.</p>
        </section>
    </main>

    <aside>
        <p>Notice: Library closed Sunday.</p>
    </aside>

    <footer>
        &copy; 2026 College
    </footer>

    <hr>

    <!-- The same type of layout made with non-semantic div elements -->
    <div>
        <div><b>College Portal (div layout)</b></div>
        <div>Home | Courses</div>
        <div>
            <h3>Admission Open</h3>
            <p>Apply before 30 June.</p>
        </div>
        <div>Notice: Library closed Sunday.</div>
        <div>&copy; 2026 College</div>
    </div>
</body>
</html>
